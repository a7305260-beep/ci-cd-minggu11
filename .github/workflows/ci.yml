name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pasang pytest
        run: pip install pytest

      - name: Jalankan tes
        run: pytest -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Build image Docker
        run: docker build -t kalkulator:ci .

      - name: Uji jalankan image
        run: docker run --rm kalkulator:ci
